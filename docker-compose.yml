services:
  phpadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      - PMA_HOST=mariadb
      - PMA_PORT=3306
      - PMA_USER=bn_opencart
      - PMA_PASSWORD=opencart_local
    ports:
      - '${PHPADMIN_PORT:-8888}:80'

  mariadb:
    image: mariadb:11.2
    environment:
      - MARIADB_ROOT_PASSWORD=opencart_root_local
      - MARIADB_USER=bn_opencart
      - MARIADB_PASSWORD=opencart_local
      - MARIADB_DATABASE=bitnami_opencart
    volumes:
      - 'mariadb_data:/var/lib/mysql'
    ports:
      - '3306:3306'

  opencart:
    image: agridyaev/opencart:4.0.2-3-debian-12-r33
    ports:
      - '${OPENCART_PORT:-8081}:8080'
      - '443:8443'
    environment:
      - OPENCART_HOST=${LOCAL_IP:-localhost}:${OPENCART_PORT:-8081}
      - OPENCART_DATABASE_HOST=mariadb
      - OPENCART_DATABASE_PORT_NUMBER=3306
      - OPENCART_DATABASE_USER=bn_opencart
      - OPENCART_DATABASE_NAME=bitnami_opencart
      - OPENCART_DATABASE_PASSWORD=opencart_local
    volumes:
      - 'opencart_data:/bitnami/opencart'
      - 'opencart_storage_data:/bitnami/opencart_storage/'
    depends_on:
      - mariadb

volumes:
  mariadb_data:
    driver: local
  opencart_data:
    driver: local
  opencart_storage_data:
    driver: local